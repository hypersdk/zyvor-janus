[workspace]
resolver = "2"
members = [
    "crates/zyvor-janus-core",
    "crates/zyvor-janus-topology",
    "crates/zyvor-janus-model",
    "crates/zyvor-janus-scheduler",
    "crates/zyvor-janus-simulator",
    "crates/zyvor-janus-cost",
    "crates/zyvor-janus-config",
    "crates/zyvor-janus-metrics",
    "crates/zyvor-janus-cli",
    "crates/zyvor-janus-py",
    "crates/zyvor-janus-api",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
authors = ["hypersdk-team"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
pyo3 = { version = "0.23", features = ["extension-module"] }
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
async-stream = "0.3"
futures-core = "0.3"
