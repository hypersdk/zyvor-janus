[package]
name = "zyvor-janus-api"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Zyvor Janus HTTP/WebSocket API server"

[[bin]]
name = "zyvor-janus-api"
path = "src/main.rs"

[dependencies]
zyvor-janus-core = { path = "../zyvor-janus-core" }
zyvor-janus-config = { path = "../zyvor-janus-config" }
zyvor-janus-metrics = { path = "../zyvor-janus-metrics" }
zyvor-janus-simulator = { path = "../zyvor-janus-simulator" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
rusqlite = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
