apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zyvor-janus-outputs
  namespace: zyvor-janus
  labels:
    app.kubernetes.io/name: zyvor-janus
    app.kubernetes.io/component: api
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zyvor-janus-api
  namespace: zyvor-janus
  labels:
    app.kubernetes.io/name: zyvor-janus
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zyvor-janus
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zyvor-janus
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: zyvor-janus-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: zyvor-janus-auth
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: outputs
              mountPath: /app/outputs
      volumes:
        - name: outputs
          persistentVolumeClaim:
            claimName: zyvor-janus-outputs
---
apiVersion: v1
kind: Service
metadata:
  name: zyvor-janus-api
  namespace: zyvor-janus
  labels:
    app.kubernetes.io/name: zyvor-janus
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: zyvor-janus
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8080
      targetPort: http
