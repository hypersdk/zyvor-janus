# NodePort exposure for lab hosts (same pattern as forge-ui / forge-api-gateway).
# Must keep selectors — a partial Service apply without them clears endpoints.
apiVersion: v1
kind: Service
metadata:
  name: forgesim-web
  namespace: forgesim
  labels:
    app.kubernetes.io/name: forgesim
    app.kubernetes.io/component: web
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: forgesim
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30300
---
apiVersion: v1
kind: Service
metadata:
  name: forgesim-api
  namespace: forgesim
  labels:
    app.kubernetes.io/name: forgesim
    app.kubernetes.io/component: api
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: forgesim
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30808
