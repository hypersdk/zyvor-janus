# Copy to secret.yaml and edit before applying:
#   cp secret.example.yaml secret.yaml
#   kubectl apply -f secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: zyvor-janus-auth
  namespace: zyvor-janus
  labels:
    app.kubernetes.io/name: zyvor-janus
type: Opaque
stringData:
  ZYVOR_JANUS_DASHBOARD_USER: Admin
  ZYVOR_JANUS_DASHBOARD_PASSWORD: change-me-before-deploy
  ZYVOR_JANUS_AUTH_SECRET: replace-with-long-random-string
  # Shared bearer token the web pod's middleware.ts injects on every
  # proxied /api/* call and the api pod checks on every route except
  # /api/health. Same secret, both pods -- via this one envFrom.
  ZYVOR_JANUS_API_KEY: replace-with-long-random-string
  # Signs short-lived /ws/runs/{id} tickets. Deliberately a distinct
  # secret from ZYVOR_JANUS_API_KEY so a leaked one can't mint the other.
  ZYVOR_JANUS_WS_TICKET_SECRET: replace-with-long-random-string
