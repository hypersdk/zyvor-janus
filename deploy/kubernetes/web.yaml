apiVersion: apps/v1
kind: Deployment
metadata:
  name: zyvor-janus-web
  namespace: zyvor-janus
  labels:
    app.kubernetes.io/name: zyvor-janus
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zyvor-janus
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zyvor-janus
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: zyvor-janus-web:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: zyvor-janus-auth
          readinessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: zyvor-janus-web
  namespace: zyvor-janus
  labels:
    app.kubernetes.io/name: zyvor-janus
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: zyvor-janus
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 3000
      targetPort: http
